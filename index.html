<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microslop Flight Simulator</title>
<style>
  html, body { margin: 0; height: 100%; background: #06101f; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
  #loading {
    position: fixed; inset: 0; z-index: 10;
    background: #0b2a5c url("loading.jpg") center / cover no-repeat;
    background-image: url("loading.jpg"), linear-gradient(160deg, #1a6fd1 0%, #0b2a5c 55%, #06101f 100%);
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    transition: opacity .8s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #title { position: absolute; top: 38%; left: 0; right: 0; text-align: center; color: #fff; font: italic 900 64px/1 "Segoe UI", system-ui, sans-serif; text-shadow: 0 4px 24px #0008; }
  #loading.has-art #title { display: none; }
  #pct { position: absolute; right: 28px; bottom: 20px; color: #fff; font: italic 800 40px/1 "Segoe UI", system-ui, sans-serif; text-shadow: 0 2px 12px #000a, 0 0 2px #000; font-variant-numeric: tabular-nums; }
  /* only shown when something went wrong (the game writes its own failures here too) */
  #status { position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px)); padding: 12px 16px; border-radius: 10px; background: #06101fdd; color: #e8f0ff; font-size: 15px; }
  #status:empty { display: none; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="loading">
  <div id="title">Microslop Flight Simulator</div>
  <div id="pct">0%</div>
  <div id="status"></div>
</div>
<script type="module">
  import init from "./pkg/fablegame.js";
  const status = document.getElementById("status");
  const pct = document.getElementById("pct");
  // Only cover the page with the artwork once it has loaded (else the gradient and title show).
  const art = new Image();
  art.onload = () => document.getElementById("loading").classList.add("has-art");
  art.src = "loading.jpg";

  if (!navigator.gpu) {
    status.textContent = "This browser has no WebGPU, which the game needs. Try Chrome or Edge.";
  } else {
    try {
      // The game is one large download (the aircraft are built in): show how far along it is.
      const res = await fetch("pkg/fablegame_bg.wasm");
      if (!res.ok) throw new Error("HTTP " + res.status);
      // The real size (the server may send it compressed, so its own length can be smaller).
      const size = await fetch("pkg/size.txt").then(r => r.ok ? r.text() : "").catch(() => "");
      const total = +size || (res.headers.get("content-encoding") ? 0 : +res.headers.get("content-length")) || 76000000;
      const reader = res.body.getReader();
      const parts = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value);
        got += value.length;
        pct.textContent = Math.min(99, Math.floor(100 * got / total)) + "%";
      }
      const bytes = new Uint8Array(got);
      let at = 0;
      for (const p of parts) { bytes.set(p, at); at += p.length; }
      pct.textContent = "100%";
      await init({ module_or_path: bytes });
      document.getElementById("game").focus();
    } catch (e) {
      // The game reports its own failures into the status line; this catches the rest.
      if (!String(e).includes("Using exceptions for control flow")) {
        console.error(e);
        status.textContent = "Could not load the game: " + e;
      }
    }
  }
</script>
</body>
</html>
